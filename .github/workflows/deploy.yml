name: Deploy Backend to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ~/htdocs/placement_backend
            
            # Pull latest changes
            git pull origin main
            
            # Install dependencies
            npm install
            
            # Generate Prisma Client and deploy migrations
            npx prisma generate
            npx prisma migrate deploy
            
            # Build project
            npm run build
            
            # Restart PM2 process
            pm2 restart placement-backend || pm2 start dist/server.js --name "placement-backend" --cwd /home/gujaratuniversity-placement/htdocs/placement_backend
